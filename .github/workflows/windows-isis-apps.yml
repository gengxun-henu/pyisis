name: windows-isis-apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ports/windows/isis/**"
      - "ports/windows/env/pyisis-isis10-win64.yml"
      - "tests/unitTest/packaging_tools_unit_test.py"
      - ".github/workflows/windows-isis-apps.yml"

concurrency:
  group: windows-isis-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isis10-app-batch:
    name: Build and smoke-test 150 ISIS 10 APPs
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    env:
      PYISIS_WINDOWS_ISIS_PREFIX: ${{ github.workspace }}\build\windows\isis10-app-prefix
      PYISIS_WINDOWS_ISIS_SOURCE: ${{ github.workspace }}\build\windows\external\isis-10.0.0-src
      PYISIS_WINDOWS_ISIS_BUILD: ${{ github.workspace }}\build\windows\isis10-app-build
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Windows ISIS 10 build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ports/windows/env/pyisis-isis10-win64.yml
          cache-environment: true
          init-shell: powershell

      - name: Resolve Windows dependency prefix
        run: |
          $prefix = (& python -c "import sys; print(sys.prefix)").Trim()
          $env:CONDA_PREFIX = $prefix
          "CONDA_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$prefix" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Library\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Library\mingw-w64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build SpiceQL 1.4.1
        run: |
          . .\ports\windows\activate_msvc.ps1
          .\ports\windows\isis\build_spiceql.ps1 -Ref 1.4.1

      - name: Fetch and patch ISIS 10.0.0
        run: |
          . .\ports\windows\activate_msvc.ps1
          .\ports\windows\isis\fetch_isis.ps1 `
            -Ref 10.0.0 `
            -SourceDir $env:PYISIS_WINDOWS_ISIS_SOURCE
          .\ports\windows\isis\apply_patches.ps1 `
            -SourceDir $env:PYISIS_WINDOWS_ISIS_SOURCE `
            -PatchDir .\ports\windows\isis\patches\10.0.0

      - name: Configure allowlisted APP batch
        run: |
          . .\ports\windows\activate_msvc.ps1
          $manifest = Get-Content `
            .\ports\windows\isis\windows-app-manifest.json `
            -Raw | ConvertFrom-Json
          $apps = @($manifest.apps | ForEach-Object { $_.name })
          if ($apps.Count -lt 150) {
            throw "Expected at least 150 allowlisted APPs, found $($apps.Count)"
          }
          .\ports\windows\isis\configure_isis.ps1 `
            -SourceDir $env:PYISIS_WINDOWS_ISIS_SOURCE `
            -BuildDir $env:PYISIS_WINDOWS_ISIS_BUILD `
            -Prefix $env:PYISIS_WINDOWS_ISIS_PREFIX `
            -IsisVersion 10.0.0 `
            -WindowsApps $apps

      - name: Build and install ISIS 10 APP batch
        run: |
          . .\ports\windows\activate_msvc.ps1
          .\ports\windows\isis\build_isis.ps1 `
            -BuildDir $env:PYISIS_WINDOWS_ISIS_BUILD `
            -Jobs 1
          .\ports\windows\isis\install_isis.ps1 `
            -BuildDir $env:PYISIS_WINDOWS_ISIS_BUILD

      - name: Verify and smoke-test APP batch
        run: |
          .\ports\windows\isis\test_isis_app_batch_smoke.ps1 `
            -Prefix $env:PYISIS_WINDOWS_ISIS_PREFIX `
            -IsisVersion 10.0.0

      - name: Validate csv2table native behavior
        run: |
          $repoRoot = $env:GITHUB_WORKSPACE
          $workDir = Join-Path $repoRoot "build\windows\csv2table-matrix\isis10-windows"
          $reportPath = Join-Path $repoRoot "build\windows\csv2table-matrix\isis10-windows.json"
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          $env:ISISROOT = $env:PYISIS_WINDOWS_ISIS_PREFIX
          $env:ISIS_PREFIX = $env:PYISIS_WINDOWS_ISIS_PREFIX
          $env:ISISDATA = Join-Path $repoRoot "tests\data\isisdata\mockup"
          $runtimeEntries = @(
            (Join-Path $env:PYISIS_WINDOWS_ISIS_PREFIX "bin"),
            (Join-Path $env:PYISIS_WINDOWS_ISIS_PREFIX "lib"),
            (Join-Path $env:CONDA_PREFIX "bin"),
            (Join-Path $env:CONDA_PREFIX "Library\bin"),
            (Join-Path $env:CONDA_PREFIX "Library\usr\bin"),
            (Join-Path $env:CONDA_PREFIX "Library\mingw-w64\bin"),
            (Join-Path $env:CONDA_PREFIX "Scripts"),
            $env:CONDA_PREFIX
          )
          $env:PATH = (($runtimeEntries | Where-Object { Test-Path $_ }) + @($env:PATH)) -join ";"

          Push-Location $workDir
          try {
            & python (Join-Path $repoRoot "tools\dev\test_csv2table_native_app.py") `
              --isis-version 10.0.0 `
              --bin-dir (Join-Path $env:PYISIS_WINDOWS_ISIS_PREFIX "bin") `
              --input-cube (Join-Path $repoRoot "tests\data\hidtmgen\ortho\PSP_002118_1510_1m_o_forPDS_cropped.cub") `
              --work-dir $workDir `
              --report $reportPath
            if ($LASTEXITCODE -ne 0) {
              throw "csv2table native validator failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          @'
          import json
          import pathlib

          report = json.loads(pathlib.Path('build/windows/csv2table-matrix/isis10-windows.json').read_text())
          assert report['summary'] == {'passed': 3, 'failed': 0, 'skipped': 0}
          assert report['platform']['os'] == 'Windows'
          assert report['isis_version']['requested'] == '10.0.0'
          assert all(item['sha256'] for item in report['native_artifacts'].values())
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "csv2table native report assertion failed with exit code $LASTEXITCODE"
          }

      - name: Upload ISIS 10 Windows native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csv2table-native-app-isis10-windows
          if-no-files-found: error
          path: build/windows/csv2table-matrix/isis10-windows.json

      - name: Upload APP batch smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-isis10-app-batch-smoke-logs
          if-no-files-found: warn
          path: build/windows/isis-app-batch-smoke/*.log
