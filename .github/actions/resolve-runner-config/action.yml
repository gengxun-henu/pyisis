name: Resolve workflow runner config
description: >-
  Read .github/runner-config.yml, validate the selected profile, and emit
  normalized runner, environment, and resource outputs.
inputs:
  config-path:
    description: Repository-relative path to the runner configuration file.
    required: false
    default: .github/runner-config.yml
  profile-override:
    description: Optional named runner profile override.
    required: false
    default: ""
outputs:
  runner_profile:
    description: Selected named runner profile.
    value: ${{ steps.resolve.outputs.runner_profile }}
  runner_mode:
    description: Selected runner mode.
    value: ${{ steps.resolve.outputs.runner_mode }}
  runs_on_json:
    description: JSON string suitable for fromJSON in runs-on.
    value: ${{ steps.resolve.outputs.runs_on_json }}
  use_ssh_checkout:
    description: Whether jobs should force SSH checkout.
    value: ${{ steps.resolve.outputs.use_ssh_checkout }}
  checkout_transport:
    description: Normalized checkout transport.
    value: ${{ steps.resolve.outputs.checkout_transport }}
  environment_strategy:
    description: Normalized environment preparation strategy.
    value: ${{ steps.resolve.outputs.environment_strategy }}
  needs_dynamic_conda_setup:
    description: Whether the runner needs workflow-created Conda setup.
    value: ${{ steps.resolve.outputs.needs_dynamic_conda_setup }}
  fallback_conda_prefix:
    description: Fallback Conda prefix for self-hosted mode.
    value: ${{ steps.resolve.outputs.fallback_conda_prefix }}
  network_profile:
    description: Selected network profile.
    value: ${{ steps.resolve.outputs.network_profile }}
  use_watt:
    description: Whether the selected profile uses WATT host routing.
    value: ${{ steps.resolve.outputs.use_watt }}
  build_jobs:
    description: Positive self-hosted CMake build parallelism.
    value: ${{ steps.resolve.outputs.build_jobs }}
  ccache_max_size:
    description: Maximum compiler cache size.
    value: ${{ steps.resolve.outputs.ccache_max_size }}
  isis_major:
    description: ISIS major line selected by the profile.
    value: ${{ steps.resolve.outputs.isis_major }}
  python_abi:
    description: CPython ABI selected by the profile.
    value: ${{ steps.resolve.outputs.python_abi }}
runs:
  using: composite
  steps:
    - name: Resolve runner configuration
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/resolve_runner_config.py \
          --config-path "${{ inputs.config-path }}" \
          --profile-override "${{ inputs.profile-override }}" \
          --github-output "$GITHUB_OUTPUT" \
          --github-step-summary "$GITHUB_STEP_SUMMARY"
