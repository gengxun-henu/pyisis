[build-system]
requires = [
  "scikit-build-core>=0.11",
  "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "usgs-pyisis-isis10"
version = "1.4.0rc1"
description = "Standalone pybind11 bindings for selected USGS ISIS 10 APIs."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "Geng Xun" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  'usgs-pyisis-runtime-isis10-win64==1.4.0rc1; platform_system == "Windows" and platform_machine == "AMD64"',
  'usgs-pyisis-runtime-isis10-linux-x86_64==1.4.0rc1; platform_system == "Linux" and platform_machine == "x86_64"',
  "usgs-pyisis-isisdata-minimal==1.3.0rc1",
]

[project.urls]
Homepage = "https://github.com/gengxun-henu/pyisis"
Source = "https://github.com/gengxun-henu/pyisis"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "../.."
build-dir = "build/{wheel_tag}"
wheel.packages = []
wheel.platlib = true

[tool.scikit-build.cmake.define]
PYISIS_BUILD_BENCHMARKS = "OFF"
ISIS_EXCLUDE_ASP_VW_CAMERA_LIBS = "ON"
