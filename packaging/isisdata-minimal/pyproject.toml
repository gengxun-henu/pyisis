[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usgs-pyisis-isisdata-minimal"
version = "1.3.0rc3"
description = "Minimal ISISDATA tree for usgs-pyisis smoke tests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Geng Xun" },
]

[project.urls]
Homepage = "https://github.com/gengxun-henu/pyisis"
Source = "https://github.com/gengxun-henu/pyisis"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pyisis_isisdata_minimal"]
include-package-data = false

[tool.setuptools.package-data]
pyisis_isisdata_minimal = ["data/**/*"]
