name: windows-native-app-isis10-clean-host

on:
  workflow_dispatch:
    inputs:
      build_runner:
        description: "Runner for the Windows ISIS10 build phase"
        required: false
        default: windows11-self-hosted
        type: choice
        options:
          - windows11-self-hosted
          - windows-2022
      build_jobs:
        description: "Parallel CMake jobs on the build runner"
        required: false
        default: "12"
        type: string
  push:
    branches:
      - feature/m04-windows-pyisis-wheelhouse

permissions:
  contents: read

concurrency:
  group: windows-native-app-isis10-clean-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package:
    name: Build ISIS 10 native APP package
    runs-on: ${{ (inputs.build_runner || 'windows11-self-hosted') == 'windows11-self-hosted' && fromJSON('["self-hosted","Windows","X64","pyisis","windows-11"]') || 'windows-2022' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      PYISIS_WINDOWS_ISIS_PREFIX: ${{ github.workspace }}\build\windows\isis10-prefix
      PYISIS_WINDOWS_ISIS_SOURCE: ${{ github.workspace }}\build\windows\external\isis-10.0.0-src
      PYISIS_WINDOWS_ISIS_BUILD: ${{ github.workspace }}\build\windows\isis10-native-build
      PYISIS_NATIVE_BUILD_JOBS: ${{ inputs.build_jobs || '12' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Windows shell tools
        if: ${{ (inputs.build_runner || 'windows11-self-hosted') != 'windows11-self-hosted' }}
        run: |
          $gitUsrBin = Join-Path $env:ProgramFiles "Git\usr\bin"
          if (-not (Test-Path (Join-Path $gitUsrBin "cygpath.exe"))) {
            throw "Git for Windows cygpath.exe is required by setup-micromamba"
          }
          $gitUsrBin | Out-File $env:GITHUB_PATH -Append

      - name: Configure Windows self-hosted Conda storage
        if: ${{ (inputs.build_runner || 'windows11-self-hosted') == 'windows11-self-hosted' }}
        run: |
          New-Item -ItemType Directory -Force -Path "D:\pyisis-conda\pkgs\isis10-v3" | Out-Null

      - name: Locate self-hosted Conda environment
        id: locate-conda
        if: ${{ (inputs.build_runner || 'windows11-self-hosted') == 'windows11-self-hosted' }}
        run: |
          $envPrefix = "D:\pyisis-conda\envs\isis10-v3"
          try {
            $envReady = Test-Path (Join-Path $envPrefix "python.exe") -ErrorAction Stop
          }
          catch {
            $envReady = $false
          }
          if ($envReady) {
            Write-Host "Reusing preinstalled ISIS10 environment at $envPrefix"
            "ready=true" | Out-File $env:GITHUB_OUTPUT -Append
            "PYISIS_CONDA_PREFIX=$envPrefix" | Out-File $env:GITHUB_ENV -Append
            return
          }
          $candidates = @(
            (Join-Path $env:USERPROFILE "miniconda3"),
            "C:\Users\runneradmin\miniconda3",
            "C:\ProgramData\miniconda3",
            "D:\tools\miniconda3",
            "D:\miniconda3"
          )
          $condaRoot = $null
          foreach ($candidate in $candidates) {
            try {
              if (Test-Path (Join-Path $candidate "Scripts\conda.exe") -ErrorAction Stop) {
                $condaRoot = $candidate
                break
              }
            }
            catch {
              Write-Warning "Cannot inspect Conda candidate $candidate"
            }
          }
          if (-not $condaRoot) {
            throw "No reusable ISIS10 environment or readable Miniconda root found"
          }
          Write-Host "Using preinstalled Conda at $condaRoot"
          "ready=false" | Out-File $env:GITHUB_OUTPUT -Append
          "CONDA=$condaRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Set up Windows ISIS 10 build environment from preinstalled Conda
        if: ${{ (inputs.build_runner || 'windows11-self-hosted') == 'windows11-self-hosted' && steps.locate-conda.outputs.ready != 'true' }}
        env:
          CONDA_ALWAYS_COPY: "true"
          PYTHON_CPU_COUNT: "1"
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: D:\pyisis-conda\envs\isis10-v3
          environment-file: ports/windows/env/pyisis-isis10-win64.yml
          conda-solver: libmamba
          pkgs-dirs: D:\pyisis-conda\pkgs\isis10-v3
          auto-activate: false
          run-init: false

      - name: Set up Windows ISIS 10 build environment with Micromamba
        if: ${{ (inputs.build_runner || 'windows11-self-hosted') != 'windows11-self-hosted' }}
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ports/windows/env/pyisis-isis10-win64.yml
          cache-environment: true
          init-shell: powershell

      - name: Resolve dependency prefix
        run: |
          if ('${{ (inputs.build_runner || 'windows11-self-hosted') }}' -eq 'windows11-self-hosted') {
            $prefix = $env:PYISIS_CONDA_PREFIX
          }
          else {
            $prefix = (& python -c "import sys; print(sys.prefix)").Trim()
          }
          if (-not (Test-Path -LiteralPath "$prefix\python.exe")) {
            throw "Conda environment Python is missing: $prefix\python.exe"
          }
          "CONDA_PREFIX=$prefix" | Out-File $env:GITHUB_ENV -Append
          "$prefix" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Scripts" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Library\bin" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Library\usr\bin" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Library\mingw-w64\bin" | Out-File $env:GITHUB_PATH -Append
          "$prefix\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Build SpiceQL 1.4.1
        run: |
          . .\ports\windows\activate_msvc.ps1
          .\ports\windows\isis\build_spiceql.ps1 -Ref 1.4.1

      - name: Fetch and patch ISIS 10.0.0
        run: |
          . .\ports\windows\activate_msvc.ps1
          .\ports\windows\isis\fetch_isis.ps1 -Ref 10.0.0 -SourceDir $env:PYISIS_WINDOWS_ISIS_SOURCE
          .\ports\windows\isis\apply_patches.ps1 -SourceDir $env:PYISIS_WINDOWS_ISIS_SOURCE -PatchDir .\ports\windows\isis\patches\10.0.0

      - name: Configure and build allowlisted APP package
        run: |
          . .\ports\windows\activate_msvc.ps1
          $manifest = Get-Content .\ports\windows\isis\windows-app-manifest.json -Raw | ConvertFrom-Json
          $apps = @($manifest.apps | ForEach-Object { $_.name })
          if ($apps.Count -lt 150) { throw "Expected at least 150 allowlisted APPs, found $($apps.Count)" }
          # qnet is the public GUI entry point and is intentionally outside
          # the 150-CLI manifest. Add it only to the build-time manifest;
          # staging and release validation continue to use the pinned CLI
          # manifest and its SHA-256 contract.
          $manifest.apps += [pscustomobject]@{
            name = "qnet"
            source_dir = "isis/src/qisis/apps/qnet"
            xml = "isis/src/qisis/apps/qnet/qnet.xml"
            versions = [pscustomobject]@{
              "10.0.0" = [pscustomobject]@{
                status = "experimental"
                build_status = "compiled_installed"
              }
            }
          }
          $buildManifest = Join-Path $env:RUNNER_TEMP "windows-app-build-manifest.json"
          $manifest | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $buildManifest -Encoding UTF8
          $apps += "qnet"
          # isisui is a runtime helper used by the packaged GUI launch path.
          # It is intentionally absent from the public 150-APP manifest.
          $apps += "isisui"
          .\ports\windows\isis\configure_isis.ps1 -SourceDir $env:PYISIS_WINDOWS_ISIS_SOURCE -BuildDir $env:PYISIS_WINDOWS_ISIS_BUILD -Prefix $env:PYISIS_WINDOWS_ISIS_PREFIX -IsisVersion 10.0.0 -WindowsApps $apps -WindowsAppManifest $buildManifest
          $requestedJobs = 12
          if ($env:PYISIS_NATIVE_BUILD_JOBS -match '^[0-9]+$') {
            $requestedJobs = [int]$env:PYISIS_NATIVE_BUILD_JOBS
          }
          $jobs = [Math]::Max(1, [Math]::Min($requestedJobs, [Environment]::ProcessorCount))
          Write-Host "Building ISIS10 native apps with $jobs parallel jobs"
          .\ports\windows\isis\build_isis.ps1 -BuildDir $env:PYISIS_WINDOWS_ISIS_BUILD -Jobs $jobs
          .\ports\windows\isis\install_isis.ps1 -BuildDir $env:PYISIS_WINDOWS_ISIS_BUILD

      - name: Verify ISIS 10 prefix
        run: .\ports\windows\isis\verify_isis_prefix.ps1 -Prefix $env:PYISIS_WINDOWS_ISIS_PREFIX -ExpectedVersion 10.0.0

      - name: Stage and archive native APP package
        run: |
          . .\ports\windows\activate_msvc.ps1
          $stageParent = Join-Path $env:GITHUB_WORKSPACE "build\windows\native-clean-host-stage"
          $output = Join-Path $env:GITHUB_WORKSPACE "build\windows\native-clean-host-output"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $dependency = Join-Path $output "usgs-isis-native-apps-10.0.0-win64-dll-dependencies.json"
          & python tools\packaging\stage_windows_native_apps.py --isis-prefix $env:PYISIS_WINDOWS_ISIS_PREFIX --minimal-data-root packaging\isisdata-minimal\src\pyisis_isisdata_minimal\data --release packaging\native-apps-win64\release-isis10.json --cli-manifest ports\windows\isis\windows-app-manifest.json --stage-parent $stageParent --dependency-report $dependency --dependency-prefix $env:CONDA_PREFIX
          if ($LASTEXITCODE -ne 0) { throw "native APP staging failed" }
          & python tools\packaging\archive_windows_native_apps.py --stage-root (Join-Path $stageParent "usgs-isis-native-apps-10.0.0-win64") --archive (Join-Path $output "usgs-isis-native-apps-10.0.0-win64.zip")
          if ($LASTEXITCODE -ne 0) { throw "native APP archive creation failed" }

      - name: Assemble clean-runtime input
        run: |
          $input = "build\windows\clean-runtime-input"
          New-Item -ItemType Directory -Force -Path $input | Out-Null
          Copy-Item build\windows\native-clean-host-output\usgs-isis-native-apps-10.0.0-win64.zip $input
          Copy-Item packaging\native-apps-win64\release-isis10.json $input
          Copy-Item ports\windows\isis\test_isis_native_app_package.ps1 $input

      - name: Upload clean-runtime input
        uses: actions/upload-artifact@v4
        with:
          name: native-app-isis10-runtime-input-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: build/windows/clean-runtime-input

      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-app-isis10-dependency-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: build/windows/native-clean-host-output/usgs-isis-native-apps-10.0.0-win64-dll-dependencies.json

  clean-runtime:
    name: Validate on clean GitHub-hosted Windows 2025 x64
    needs: build-package
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download runtime inputs only
        uses: actions/download-artifact@v4
        with:
          name: native-app-isis10-runtime-input-${{ github.run_id }}
          path: input

      - name: Assert clean host and run complete matrix
        run: |
          $forbidden = @(
            "D:\code\pyisis\pyisis\build\windows\isis10-prefix",
            "D:\pyisis-win-env"
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) { throw "forbidden path exists: $path" }
          }
          $inputFiles = @(Get-ChildItem -LiteralPath input -File)
          if ($inputFiles.Count -ne 3) { throw "clean runtime input must contain exactly three files" }
          $cleanRoot = Join-Path $env:RUNNER_TEMP "pyisis-native-clean"
          $output = Join-Path $cleanRoot "output"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $runtimeReport = Join-Path $output "runtime-validation.json"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned `
            -File input\test_isis_native_app_package.ps1 `
            -Archive input\usgs-isis-native-apps-10.0.0-win64.zip `
            -ReleaseConfig input\release-isis10.json `
            -WorkDir (Join-Path $cleanRoot "work with spaces") `
            -Report $runtimeReport `
            -ForbiddenPath $forbidden[0] `
            -ForbiddenPath $forbidden[1]
          if ($LASTEXITCODE -ne 0) { throw "clean-host runtime matrix failed" }

      - name: Bind clean-host provenance
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $cleanRoot = Join-Path $env:RUNNER_TEMP "pyisis-native-clean"
          $evidence = Join-Path $env:GITHUB_WORKSPACE "clean-runtime-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $runtime = Join-Path $cleanRoot "output\runtime-validation.json"
          Copy-Item -LiteralPath $runtime -Destination $evidence
          $payload = [ordered]@{
            schema_version = 1
            head_sha = $env:HEAD_SHA
            run_id = $env:RUN_ID
            run_attempt = $env:RUN_ATTEMPT
            job = "clean-runtime"
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            archive_sha256 = (Get-FileHash input\usgs-isis-native-apps-10.0.0-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            runtime_report_sha256 = (Get-FileHash $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $payload | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence "clean-host-provenance.json") -Encoding UTF8

      - name: Upload raw clean-host runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-app-isis10-clean-runtime-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: clean-runtime-evidence

  bind-evidence:
    name: Bind and upload final evidence
    needs: [build-package, clean-runtime]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download runtime inputs
        uses: actions/download-artifact@v4
        with:
          name: native-app-isis10-runtime-input-${{ github.run_id }}
          path: evidence/input

      - name: Download dependency evidence
        uses: actions/download-artifact@v4
        with:
          name: native-app-isis10-dependency-evidence-${{ github.run_id }}
          path: evidence/dependency

      - name: Download raw clean-host runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: native-app-isis10-clean-runtime-${{ github.run_id }}
          path: evidence/runtime

      - name: Verify dispatch provenance and bind reports
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $runtime = "evidence\runtime\runtime-validation.json"
          $provenance = Get-Content -Raw evidence\runtime\clean-host-provenance.json | ConvertFrom-Json
          if ($provenance.head_sha -cne $env:HEAD_SHA) { throw "clean runtime head SHA mismatch" }
          if ([string]$provenance.run_id -cne $env:RUN_ID) { throw "clean runtime run ID mismatch" }
          if ([string]$provenance.run_attempt -cne $env:RUN_ATTEMPT) { throw "clean runtime run attempt mismatch" }
          if ($provenance.job -cne "clean-runtime") { throw "clean runtime job mismatch" }
          $runtimeSha = (Get-FileHash $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.runtime_report_sha256 -cne $runtimeSha) { throw "clean runtime report SHA mismatch" }
          $archive = "evidence\input\usgs-isis-native-apps-10.0.0-win64.zip"
          $archiveSha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.archive_sha256 -cne $archiveSha) { throw "clean runtime archive SHA mismatch" }
          $final = "evidence\final"
          New-Item -ItemType Directory -Force -Path $final | Out-Null
          & python tools\packaging\validate_windows_native_apps.py `
            --archive $archive `
            --dependency-report evidence\dependency\usgs-isis-native-apps-10.0.0-win64-dll-dependencies.json `
            --runtime-report $runtime `
            --release evidence\input\release-isis10.json `
            --cli-manifest ports\windows\isis\windows-app-manifest.json `
            --output-report (Join-Path $final "isis-native-apps-10.0.0-win64-validation.json")
          if ($LASTEXITCODE -ne 0) { throw "clean-host evidence binding failed" }
          Copy-Item $archive $final
          Copy-Item evidence\dependency\usgs-isis-native-apps-10.0.0-win64-dll-dependencies.json $final
          $finalFiles = @(Get-ChildItem -LiteralPath $final -File)
          if ($finalFiles.Count -ne 3) { throw "final evidence must contain exactly three files" }

      - name: Upload final three retained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-app-isis10-final-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: evidence/final
