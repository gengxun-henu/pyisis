name: windows-native-app-clean-host

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-app-clean-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package:
    name: Build ISIS 9 native APP package
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      PYISIS_WINDOWS_ISIS_PREFIX: ${{ github.workspace }}\build\windows\isis-prefix
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Windows ISIS build environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: pyisis-isis-win64
          environment-file: ports/windows/env/pyisis-isis-win64.yml
          conda-solver: classic
          auto-activate: false

      - name: Resolve dependency prefix
        run: |
          $prefix = (& python -c "import sys; print(sys.prefix)").Trim()
          "CONDA_PREFIX=$prefix" | Out-File $env:GITHUB_ENV -Append
          "$prefix" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Scripts" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Library\bin" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Library\usr\bin" | Out-File $env:GITHUB_PATH -Append
          "$prefix\Library\mingw-w64\bin" | Out-File $env:GITHUB_PATH -Append
          "$prefix\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Restore ISIS 9 prefix cache
        id: isis-prefix-cache
        uses: actions/cache/restore@v6
        with:
          path: build/windows/isis-prefix
          key: windows-x64-isis-9.0.0-prefix-v2-${{ hashFiles('ports/windows/activate_msvc.ps1', 'ports/windows/env/pyisis-isis-win64.yml', 'ports/windows/isis/common.ps1', 'ports/windows/isis/fetch_isis.ps1', 'ports/windows/isis/apply_patches.ps1', 'ports/windows/isis/configure_isis.ps1', 'ports/windows/isis/build_isis.ps1', 'ports/windows/isis/install_isis.ps1', 'ports/windows/isis/patches/*.patch') }}

      - name: Build ISIS 9 prefix on cache miss
        if: ${{ steps.isis-prefix-cache.outputs.cache-hit != 'true' }}
        run: |
          . .\ports\windows\activate_msvc.ps1
          .\ports\windows\isis\fetch_isis.ps1
          .\ports\windows\isis\apply_patches.ps1
          .\ports\windows\isis\configure_isis.ps1
          .\ports\windows\isis\build_isis.ps1
          .\ports\windows\isis\install_isis.ps1

      - name: Verify ISIS 9 prefix
        run: .\ports\windows\isis\verify_isis_prefix.ps1 -Prefix $env:PYISIS_WINDOWS_ISIS_PREFIX -ExpectedVersion 9.0.0

      - name: Stage and archive native APP package
        run: |
          . .\ports\windows\activate_msvc.ps1
          $stageParent = Join-Path $env:GITHUB_WORKSPACE "build\windows\native-clean-host-stage"
          $output = Join-Path $env:GITHUB_WORKSPACE "build\windows\native-clean-host-output"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $dependency = Join-Path $output "usgs-isis-native-apps-9.0.0-win64-dll-dependencies.json"
          & python tools\packaging\stage_windows_native_apps.py `
            --isis-prefix $env:PYISIS_WINDOWS_ISIS_PREFIX `
            --minimal-data-root packaging\isisdata-minimal\src\pyisis_isisdata_minimal\data `
            --release packaging\native-apps-win64\release.json `
            --cli-manifest ports\windows\isis\windows-app-manifest.json `
            --stage-parent $stageParent `
            --dependency-report $dependency `
            --dependency-prefix $env:CONDA_PREFIX
          if ($LASTEXITCODE -ne 0) { throw "native APP staging failed" }
          & python tools\packaging\archive_windows_native_apps.py `
            --stage-root (Join-Path $stageParent "usgs-isis-native-apps-9.0.0-win64") `
            --archive (Join-Path $output "usgs-isis-native-apps-9.0.0-win64.zip")
          if ($LASTEXITCODE -ne 0) { throw "native APP archive creation failed" }

      - name: Assemble clean-runtime input
        run: |
          $input = "build\windows\clean-runtime-input"
          New-Item -ItemType Directory -Force -Path $input | Out-Null
          Copy-Item build\windows\native-clean-host-output\usgs-isis-native-apps-9.0.0-win64.zip $input
          Copy-Item packaging\native-apps-win64\release.json $input
          Copy-Item ports\windows\isis\test_isis_native_app_package.ps1 $input

      - name: Upload clean-runtime input
        uses: actions/upload-artifact@v4
        with:
          name: native-app-runtime-input-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: build/windows/clean-runtime-input

      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-app-dependency-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: build/windows/native-clean-host-output/usgs-isis-native-apps-9.0.0-win64-dll-dependencies.json

  clean-runtime:
    name: Validate on clean Windows 11 x64
    needs: build-package
    runs-on: [self-hosted, Windows, X64, pyisis, windows-11]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download runtime inputs only
        uses: actions/download-artifact@v4
        with:
          name: native-app-runtime-input-${{ github.run_id }}
          path: input

      - name: Assert clean host and run complete matrix
        run: |
          $forbidden = @(
            "D:\code\pyisis\pyisis\build\windows\isis-prefix",
            "D:\pyisis-win-env"
          )
          foreach ($path in $forbidden) {
            if (Test-Path -LiteralPath $path) { throw "forbidden path exists: $path" }
          }
          $inputFiles = @(Get-ChildItem -LiteralPath input -File)
          if ($inputFiles.Count -ne 3) { throw "clean runtime input must contain exactly three files" }
          $cleanRoot = Join-Path $env:RUNNER_TEMP "pyisis-native-clean"
          $output = Join-Path $cleanRoot "output"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $runtimeReport = Join-Path $output "runtime-validation.json"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned `
            -File input\test_isis_native_app_package.ps1 `
            -Archive input\usgs-isis-native-apps-9.0.0-win64.zip `
            -ReleaseConfig input\release.json `
            -WorkDir (Join-Path $cleanRoot "work with spaces") `
            -Report $runtimeReport `
            -ForbiddenPath $forbidden[0] `
            -ForbiddenPath $forbidden[1]
          if ($LASTEXITCODE -ne 0) { throw "clean-host runtime matrix failed" }

      - name: Bind clean-host provenance
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $cleanRoot = Join-Path $env:RUNNER_TEMP "pyisis-native-clean"
          $evidence = Join-Path $env:GITHUB_WORKSPACE "clean-runtime-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $runtime = Join-Path $cleanRoot "output\runtime-validation.json"
          Copy-Item -LiteralPath $runtime -Destination $evidence
          $payload = [ordered]@{
            schema_version = 1
            head_sha = $env:HEAD_SHA
            run_id = $env:RUN_ID
            run_attempt = $env:RUN_ATTEMPT
            job = "clean-runtime"
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            archive_sha256 = (Get-FileHash input\usgs-isis-native-apps-9.0.0-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            runtime_report_sha256 = (Get-FileHash $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $payload | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence "clean-host-provenance.json") -Encoding UTF8

      - name: Upload raw clean-host runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-app-clean-runtime-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: clean-runtime-evidence

  bind-evidence:
    name: Bind and upload final evidence
    needs: [build-package, clean-runtime]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download runtime inputs
        uses: actions/download-artifact@v4
        with:
          name: native-app-runtime-input-${{ github.run_id }}
          path: evidence/input

      - name: Download dependency evidence
        uses: actions/download-artifact@v4
        with:
          name: native-app-dependency-evidence-${{ github.run_id }}
          path: evidence/dependency

      - name: Download raw clean-host runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: native-app-clean-runtime-${{ github.run_id }}
          path: evidence/runtime

      - name: Verify dispatch provenance and bind reports
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $runtime = "evidence\runtime\runtime-validation.json"
          $provenance = Get-Content -Raw evidence\runtime\clean-host-provenance.json | ConvertFrom-Json
          if ($provenance.head_sha -cne $env:HEAD_SHA) { throw "clean runtime head SHA mismatch" }
          if ([string]$provenance.run_id -cne $env:RUN_ID) { throw "clean runtime run ID mismatch" }
          if ([string]$provenance.run_attempt -cne $env:RUN_ATTEMPT) { throw "clean runtime run attempt mismatch" }
          if ($provenance.job -cne "clean-runtime") { throw "clean runtime job mismatch" }
          $runtimeSha = (Get-FileHash $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.runtime_report_sha256 -cne $runtimeSha) { throw "clean runtime report SHA mismatch" }
          $archive = "evidence\input\usgs-isis-native-apps-9.0.0-win64.zip"
          $archiveSha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.archive_sha256 -cne $archiveSha) { throw "clean runtime archive SHA mismatch" }
          $final = "evidence\final"
          New-Item -ItemType Directory -Force -Path $final | Out-Null
          & python tools\packaging\validate_windows_native_apps.py `
            --archive $archive `
            --dependency-report evidence\dependency\usgs-isis-native-apps-9.0.0-win64-dll-dependencies.json `
            --runtime-report $runtime `
            --release evidence\input\release.json `
            --cli-manifest ports\windows\isis\windows-app-manifest.json `
            --output-report (Join-Path $final "isis-native-apps-9.0.0-win64-validation.json")
          if ($LASTEXITCODE -ne 0) { throw "clean-host evidence binding failed" }
          Copy-Item $archive $final
          Copy-Item evidence\dependency\usgs-isis-native-apps-9.0.0-win64-dll-dependencies.json $final
          $finalFiles = @(Get-ChildItem -LiteralPath $final -File)
          if ($finalFiles.Count -ne 3) { throw "final evidence must contain exactly three files" }

      - name: Upload final three retained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-app-final-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: evidence/final
