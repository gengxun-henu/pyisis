name: wheels

on:
  workflow_dispatch:
    inputs:
      run_isis_app_smoke:
        description: "Run the optional ISIS CLI smoke test before building wheels"
        required: false
        default: false
        type: boolean
      publish_testpypi:
        description: "Upload the checked wheelhouse to TestPyPI and verify install"
        required: false
        default: false
        type: boolean
      publish_github_release:
        description: "Create the configured GitHub prerelease after all platform checks pass"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "python/**"
      - "src/**"
      - "packaging/**"
      - "tools/packaging/**"
      - "ports/linux/**"
      - "ports/windows/**"
      - "tests/unitTest/*packaging*_unit_test.py"
      - "tests/unitTest/*runtime*_unit_test.py"
      - "tests/unitTest/wheel_workflow_unit_test.py"
      - ".github/workflows/wheels.yml"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cp312-build:
    name: Build Linux cp312 manylinux_2_35 wheels
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      MAMBA_ROOT_PREFIX: /opt/pyisis-micromamba
      HOSTED_CONDA_PREFIX: /opt/pyisis-conda
      WHEELHOUSE: ${{ github.workspace }}/wheelhouse
      ABI_REPORT_DIR: ${{ github.workspace }}/build/packaging/linux-abi-report
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Linux ISIS wheel environment
        uses: ./.github/actions/setup-hosted-micromamba
        with:
          environment-name: pyisis-isis-linux-64
          environment-file: ports/linux/env/pyisis-isis-linux-64.yml
          root-prefix: ${{ env.MAMBA_ROOT_PREFIX }}
          target-prefix: ${{ env.HOSTED_CONDA_PREFIX }}

      - name: Resolve Linux ISIS prefix
        uses: ./.github/actions/resolve-conda-isis-prefix
        with:
          runner-mode: github-hosted
          fallback-conda-prefix: ""
          hosted-conda-prefix: ${{ env.HOSTED_CONDA_PREFIX }}

      - name: Select conda compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler=""
          for compiler_name in \
            x86_64-conda-linux-gnu-c++ \
            x86_64-conda-linux-gnu-g++ \
            g++; do
            candidate="$(command -v "$compiler_name" || true)"
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              compiler="$candidate"
              break
            fi
          done
          if [ -z "$compiler" ]; then
            echo "::error::No usable C++ compiler was found in the manylinux container."
            exit 1
          fi
          "$compiler" --version
          echo "CXX=$compiler" >> "$GITHUB_ENV"

      - name: Build Linux wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          bash tools/packaging/build_wheels_linux.sh \
            --isis-prefix "$ISIS_PREFIX" \
            --output-dir "$WHEELHOUSE" \
            --python-executable "$PYTHON_BIN" \
            --dependency-prefix "$CONDA_PREFIX" \
            --platform-tag manylinux_2_35_x86_64

      - name: Audit Linux ABI and wheel policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ABI_REPORT_DIR"
          "$PYTHON_BIN" tools/packaging/audit_linux_wheelhouse.py \
            --wheelhouse "$WHEELHOUSE" \
            --target-glibc 2.28 \
            --require-target \
            --report "$ABI_REPORT_DIR/glibc-symbol-report.json"
          native_wheel_count=0
          for wheel in "$WHEELHOUSE"/*-manylinux_2_35_x86_64.whl; do
            test -f "$wheel"
            native_wheel_count=$((native_wheel_count + 1))
            wheel_name="$(basename "$wheel" .whl)"
            report="$ABI_REPORT_DIR/auditwheel-${wheel_name}.txt"
            env -u LD_LIBRARY_PATH auditwheel show "$wheel" 2>&1 | tee "$report"
            "$PYTHON_BIN" tools/packaging/validate_auditwheel_policy.py \
              --report "$report" \
              --target 2.35 \
              --architecture x86_64
          done
          test "$native_wheel_count" -eq 1

      - name: Upload Linux ABI report
        uses: actions/upload-artifact@v4
        with:
          name: usgs-pyisis-linux-cp312-abi-report
          if-no-files-found: error
          path: build/packaging/linux-abi-report/*

      - name: Upload Linux wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: usgs-pyisis-linux-cp312-manylinux-wheelhouse
          if-no-files-found: error
          path: wheelhouse/*.whl

  linux-cp312-clean-install:
    name: Test Linux cp312 wheels on ${{ matrix.os }}
    needs: linux-cp312-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up clean Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Linux wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: usgs-pyisis-linux-cp312-manylinux-wheelhouse
          path: wheelhouse

      - name: Test isolated wheel install
        shell: bash
        run: |
          set -euo pipefail
          python tools/packaging/test_wheel_install.py \
            --wheelhouse "$GITHUB_WORKSPACE/wheelhouse" \
            --venv "$GITHUB_WORKSPACE/build/packaging/linux-pip-smoke-venv" \
            --test-list tools/packaging/basic_tests.txt

  linux-isis10-cp313-build:
    name: Build ISIS 10 Linux cp313 manylinux_2_35 wheels
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      MAMBA_ROOT_PREFIX: /opt/pyisis-isis10-micromamba
      HOSTED_CONDA_PREFIX: /opt/pyisis-isis10-conda
      WHEELHOUSE: ${{ github.workspace }}/wheelhouse-isis10
      ABI_REPORT_DIR: ${{ github.workspace }}/build/packaging/linux-isis10-abi-report
      PYISIS_MAX_LINUX_RUNTIME_BYTES: "1100000000"
      PYISIS_MAX_LINUX_RUNTIME_WHEEL_BYTES: "550000000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Linux ISIS 10 wheel environment
        uses: ./.github/actions/setup-hosted-micromamba
        with:
          environment-name: pyisis-isis10-linux-64
          environment-file: ports/linux/env/pyisis-isis10-linux-64.yml
          root-prefix: ${{ env.MAMBA_ROOT_PREFIX }}
          target-prefix: ${{ env.HOSTED_CONDA_PREFIX }}

      - name: Resolve Linux ISIS 10 prefix
        uses: ./.github/actions/resolve-conda-isis-prefix
        with:
          runner-mode: github-hosted
          fallback-conda-prefix: ""
          hosted-conda-prefix: ${{ env.HOSTED_CONDA_PREFIX }}

      - name: Select conda compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler=""
          for compiler_name in \
            x86_64-conda-linux-gnu-c++ \
            x86_64-conda-linux-gnu-g++ \
            g++; do
            candidate="$(command -v "$compiler_name" || true)"
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              compiler="$candidate"
              break
            fi
          done
          if [ -z "$compiler" ]; then
            echo "::error::No usable C++ compiler was found in the manylinux container."
            exit 1
          fi
          "$compiler" --version
          echo "CXX=$compiler" >> "$GITHUB_ENV"

      - name: Build ISIS 10 Linux wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          bash tools/packaging/build_wheels_linux.sh \
            --isis-prefix "$ISIS_PREFIX" \
            --output-dir "$WHEELHOUSE" \
            --python-executable "$PYTHON_BIN" \
            --dependency-prefix "$CONDA_PREFIX" \
            --platform-tag manylinux_2_35_x86_64 \
            --binding-project-dir packaging/bindings-isis10 \
            --distribution-name usgs-pyisis-isis10 \
            --runtime-distribution usgs-pyisis-runtime-isis10-linux-x86_64 \
            --package-version 1.4.0rc1

      - name: Audit ISIS 10 Linux ABI and wheel policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ABI_REPORT_DIR"
          "$PYTHON_BIN" tools/packaging/audit_linux_wheelhouse.py \
            --wheelhouse "$WHEELHOUSE" \
            --target-glibc 2.28 \
            --require-target \
            --report "$ABI_REPORT_DIR/glibc-symbol-report.json"
          native_wheel_count=0
          for wheel in "$WHEELHOUSE"/*-manylinux_2_35_x86_64.whl; do
            test -f "$wheel"
            native_wheel_count=$((native_wheel_count + 1))
            wheel_name="$(basename "$wheel" .whl)"
            report="$ABI_REPORT_DIR/auditwheel-${wheel_name}.txt"
            env -u LD_LIBRARY_PATH auditwheel show "$wheel" 2>&1 | tee "$report"
            "$PYTHON_BIN" tools/packaging/validate_auditwheel_policy.py \
              --report "$report" \
              --target 2.35 \
              --architecture x86_64
          done
          test "$native_wheel_count" -eq 1

      - name: Upload ISIS 10 Linux ABI report
        uses: actions/upload-artifact@v4
        with:
          name: usgs-pyisis-isis10-linux-cp313-abi-report
          if-no-files-found: error
          path: build/packaging/linux-isis10-abi-report/*

      - name: Upload ISIS 10 Linux wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: usgs-pyisis-isis10-linux-cp313-manylinux-wheelhouse
          if-no-files-found: error
          path: wheelhouse-isis10/*.whl

  linux-isis10-cp313-clean-install:
    name: Test ISIS 10 Linux cp313 wheels on ${{ matrix.os }}
    needs: linux-isis10-cp313-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up clean Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download ISIS 10 Linux wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: usgs-pyisis-isis10-linux-cp313-manylinux-wheelhouse
          path: wheelhouse-isis10

      - name: Test isolated ISIS 10 wheel install
        shell: bash
        run: |
          set -euo pipefail
          python tools/packaging/test_wheel_install.py \
            --wheelhouse "$GITHUB_WORKSPACE/wheelhouse-isis10" \
            --venv "$GITHUB_WORKSPACE/build/packaging/linux-isis10-pip-smoke-venv" \
            --package usgs-pyisis-isis10 \
            --expected-isis-version 10.0.0 \
            --test-list tools/packaging/basic_tests.txt

  windows-cp312:
    name: Build Windows cp312 wheels
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    env:
      PYISIS_WINDOWS_ISIS_PREFIX: ${{ github.workspace }}\build\windows\isis-prefix
      WHEELHOUSE: ${{ github.workspace }}\wheelhouse
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for packaging checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Windows ISIS build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ports/windows/env/pyisis-isis-win64.yml
          cache-environment: true
          init-shell: powershell

      - name: Resolve Windows dependency prefix
        run: |
          $prefix = (& python -c "import sys; print(sys.prefix)").Trim()
          $env:CONDA_PREFIX = $prefix
          "CONDA_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYISIS_WINDOWS_DEP_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$prefix" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Library\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\Library\mingw-w64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore cached ISIS 9.0.0 Windows prefix
        id: windows-isis-prefix-cache
        uses: actions/cache/restore@v6
        with:
          path: build/windows/isis-prefix
          key: windows-2022-isis-9.0.0-prefix-v1-${{ hashFiles('ports/windows/activate_msvc.ps1', 'ports/windows/env/pyisis-isis-win64.yml', 'ports/windows/isis/**') }}

      - name: Build ISIS 9.0.0 Windows prefix
        if: ${{ steps.windows-isis-prefix-cache.outputs.cache-hit != 'true' }}
        run: |
          . .\ports\windows\activate_msvc.ps1
          .\ports\windows\isis\fetch_isis_900.ps1
          .\ports\windows\isis\apply_patches.ps1
          .\ports\windows\isis\configure_isis.ps1
          .\ports\windows\isis\build_isis.ps1
          .\ports\windows\isis\install_isis.ps1

      - name: Verify ISIS 9.0.0 Windows prefix
        run: .\ports\windows\isis\verify_isis_prefix.ps1 -Prefix $env:PYISIS_WINDOWS_ISIS_PREFIX

      - name: Report ISIS 9.0.0 Windows prefix size
        run: |
          $files = Get-ChildItem -LiteralPath $env:PYISIS_WINDOWS_ISIS_PREFIX -Recurse -File
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          if ($null -eq $bytes) {
            $bytes = 0
          }
          $gib = $bytes / 1GB
          "ISIS Windows prefix: $($files.Count) files, $bytes bytes ($($gib.ToString('F2')) GiB)" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Save ISIS 9.0.0 Windows prefix cache
        if: ${{ steps.windows-isis-prefix-cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: build/windows/isis-prefix
          key: ${{ steps.windows-isis-prefix-cache.outputs.cache-primary-key }}

      - name: Run optional ISIS app smoke
        if: ${{ github.event.inputs.run_isis_app_smoke == 'true' }}
        run: .\ports\windows\isis\test_isis_apps_smoke.ps1 -Prefix $env:PYISIS_WINDOWS_ISIS_PREFIX

      - name: Build wheelhouse
        run: |
          .\tools\packaging\build_wheels.ps1 `
            -IsisPrefix $env:PYISIS_WINDOWS_ISIS_PREFIX `
            -OutputDir $env:WHEELHOUSE `
            -PythonExecutable "$env:PYISIS_WINDOWS_DEP_PREFIX\python.exe" `
            -DependencyPrefix $env:PYISIS_WINDOWS_DEP_PREFIX

      - name: Test wheel install
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE "build\packaging\pip-smoke-venv"
          if (Test-Path -LiteralPath $venv) {
            Remove-Item -LiteralPath $venv -Recurse -Force
          }
          & "$env:PYISIS_WINDOWS_DEP_PREFIX\python.exe" tools\packaging\test_wheel_install.py `
            --wheelhouse $env:WHEELHOUSE `
            --venv $venv `
            --test-list tools\packaging\basic_tests.txt

      - name: Check wheel metadata
        run: |
          .\tools\packaging\publish_testpypi.ps1 `
            -Wheelhouse $env:WHEELHOUSE `
            -PythonExecutable "$env:PYISIS_WINDOWS_DEP_PREFIX\python.exe" `
            -CheckOnly

      - name: Publish wheelhouse to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_testpypi == 'true' }}
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if (-not $env:TESTPYPI_API_TOKEN) {
            throw "TESTPYPI_API_TOKEN secret is required to publish wheels to TestPyPI."
          }
          .\tools\packaging\publish_testpypi.ps1 `
            -Wheelhouse $env:WHEELHOUSE `
            -PythonExecutable "$env:PYISIS_WINDOWS_DEP_PREFIX\python.exe" `
            -Upload

      - name: Verify TestPyPI install
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_testpypi == 'true' }}
        run: |
          $venv = Join-Path $env:GITHUB_WORKSPACE "build\packaging\testpypi-venv"
          if (Test-Path -LiteralPath $venv) {
            Remove-Item -LiteralPath $venv -Recurse -Force
          }
          & "$env:PYISIS_WINDOWS_DEP_PREFIX\python.exe" tools\packaging\test_testpypi_install.py `
            --venv $venv

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usgs-pyisis-windows-cp312-wheels
          if-no-files-found: error
          path: wheelhouse/*.whl

  github-release:
    name: Publish configured GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.publish_github_release == 'true' }}
    needs:
      - linux-cp312-build
      - linux-cp312-clean-install
      - windows-cp312
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          release = tomllib.loads(
              Path("packaging/release.toml").read_text(encoding="utf-8")
          )["release"]
          values = {
              "PACKAGE_VERSION": release["package_version"],
              "ISIS_VERSION": release["isis_version"],
              "RELEASE_TAG": release["tag"],
              "RELEASE_TITLE": release["title"],
              "PYTHON_ABI": release["python_abi"],
              "LINUX_PLATFORM": release["linux_platform"],
              "WINDOWS_PLATFORM": release["windows_platform"],
              "RELEASE_PRERELEASE": str(release["prerelease"]).lower(),
              "LINUX_ASSET": release["linux_asset"],
              "WINDOWS_ASSET": release["windows_asset"],
              "RELEASE_NOTES_FILE": release["notes_file"],
              "LINUX_INSTALL_FILE": release["linux_install_file"],
              "WINDOWS_INSTALL_FILE": release["windows_install_file"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  if "\n" in value:
                      raise ValueError(f"Release manifest value contains a newline: {key}")
                  stream.write(f"{key}={value}\n")
          PY

      - name: Download validated Linux wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: usgs-pyisis-linux-cp312-manylinux-wheelhouse
          path: release-input/linux/wheelhouse

      - name: Download validated Windows wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: usgs-pyisis-windows-cp312-wheels
          path: release-input/windows/wheelhouse

      - name: Validate release wheel sets
        shell: bash
        run: |
          set -euo pipefail
          linux_wheelhouse="release-input/linux/wheelhouse"
          windows_wheelhouse="release-input/windows/wheelhouse"

          test -f "$linux_wheelhouse/usgs_pyisis-${PACKAGE_VERSION}-${PYTHON_ABI}-${PYTHON_ABI}-${LINUX_PLATFORM}.whl"
          test -f "$linux_wheelhouse/usgs_pyisis_isisdata_minimal-${PACKAGE_VERSION}-py3-none-any.whl"
          test "$(find "$linux_wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 2

          test -f "$windows_wheelhouse/usgs_pyisis-${PACKAGE_VERSION}-${PYTHON_ABI}-${PYTHON_ABI}-${WINDOWS_PLATFORM}.whl"
          test -f "$windows_wheelhouse/usgs_pyisis_runtime_win64-${PACKAGE_VERSION}-py3-none-${WINDOWS_PLATFORM}.whl"
          test -f "$windows_wheelhouse/usgs_pyisis_isisdata_minimal-${PACKAGE_VERSION}-py3-none-any.whl"
          test "$(find "$windows_wheelhouse" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 3

      - name: Assemble release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/linux/wheelhouse release-assets/windows/wheelhouse
          cp release-input/linux/wheelhouse/*.whl release-assets/linux/wheelhouse/
          cp release-input/windows/wheelhouse/*.whl release-assets/windows/wheelhouse/
          cp "$LINUX_INSTALL_FILE" release-assets/linux/INSTALL.md
          cp "$WINDOWS_INSTALL_FILE" release-assets/windows/INSTALL.md
          cp LICENSE THIRD_PARTY_NOTICES.md release-assets/linux/
          cp LICENSE THIRD_PARTY_NOTICES.md release-assets/windows/

          (
            cd release-assets/linux
            zip -r "../$LINUX_ASSET" .
          )
          (
            cd release-assets/windows
            zip -r "../$WINDOWS_ASSET" .
          )
          (
            cd release-assets
            sha256sum "$LINUX_ASSET" "$WINDOWS_ASSET" > SHA256SUMS.txt
          )

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists: $RELEASE_TAG"
            exit 1
          fi

          prerelease_args=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "release-assets/$LINUX_ASSET" \
            "release-assets/$WINDOWS_ASSET" \
            "release-assets/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_FILE" \
            "${prerelease_args[@]}"
