# Unified workflow runner configuration
#
# Switching strategy:
# - Set `active_profile` to one of the profiles listed below.
# - This repository currently defaults to `self-hosted-http` because WATT/Hosts
#   acceleration is not always running on the local self-hosted runner.
# - Switch to `self-hosted-watt` only when WATT Toolkit is running reliably for
#   unattended automation.
# when using `self-hosted-ssh`, ensure that the self-hosted runner is configured
# to allow SSH access and that the necessary SSH keys are set up in GitHub Secrets.

active_profile: pyisis-ubuntu26-isis9

# Shared local fallback used when a profile does not override it
fallback_conda_prefix: /home/gengxun/miniconda3/envs/asp360_new

profiles:
  pyisis-ubuntu26-isis9:
    mode: self-hosted
    labels: [self-hosted, linux, x64, pyisis, ubuntu-26.04, isis9]
    checkout_transport: https
    environment_strategy: existing-conda
    network_profile: plain-http
    use_watt: false
    build_jobs: "16"
    ccache_max_size: 20G
    isis_major: "9"
    python_abi: cp312
    fallback_conda_prefix: /home/gengxun/miniconda3/envs/asp360_new

  pyisis-ubuntu26-isis10:
    mode: self-hosted
    labels: [self-hosted, linux, x64, pyisis, ubuntu-26.04, isis10]
    checkout_transport: https
    environment_strategy: existing-conda
    network_profile: plain-http
    use_watt: false
    build_jobs: "16"
    ccache_max_size: 20G
    isis_major: "10"
    python_abi: cp313
    fallback_conda_prefix: /home/gengxun/miniconda3/envs/asp370

  self-hosted-http:
    mode: self-hosted
    labels: [self-hosted]
    checkout_transport: https
    environment_strategy: existing-conda
    network_profile: plain-http
    use_watt: false
    build_jobs: "16"
    ccache_max_size: 20G
    isis_major: "9"
    python_abi: cp312

  self-hosted-watt:
    mode: self-hosted
    labels: [self-hosted]
    checkout_transport: https
    environment_strategy: existing-conda
    network_profile: watt-hosts
    use_watt: true
    build_jobs: "16"
    ccache_max_size: 20G
    isis_major: "9"
    python_abi: cp312

  self-hosted-ssh:
    mode: self-hosted
    labels: [self-hosted]
    checkout_transport: ssh
    environment_strategy: existing-conda
    network_profile: ssh-fallback
    use_watt: false
    build_jobs: "16"
    ccache_max_size: 20G
    isis_major: "9"
    python_abi: cp312

  github-hosted:
    mode: github-hosted
    github_hosted_runner: ubuntu-22.04
    checkout_transport: https
    environment_strategy: micromamba
    network_profile: github-hosted
    use_watt: false
    build_jobs: "16"
    ccache_max_size: 20G
    isis_major: "9"
    python_abi: cp312
